name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core (required by CLI and web tests)
        run: bun run --filter @gnomad-cf/core build

      - name: Run core tests
        run: bun run --filter @gnomad-cf/core test

      - name: Run CLI tests
        run: bun run --filter @gnomad-cf/cli test

      - name: Run web component tests
        run: bun run --filter gnomad-cf-web test

      - name: Run coverage reporting
        continue-on-error: true
        run: bun run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build web app for E2E
        run: bun run --filter @gnomad-cf/core build && bun run --filter gnomad-cf-web build

      - name: Run E2E tests
        run: npx playwright test

      - name: Coverage summary
        if: always()
        run: |
          echo "## Enforced Coverage Thresholds"
          echo "Vitest strictly enforces these thresholds — violations fail the build."
          echo "- Core: 80%+ lines"
          echo "- CLI: 70%+ lines"
          echo "- Web: 35%+ lines"
          echo "- Codebase target: > 89% lines"
