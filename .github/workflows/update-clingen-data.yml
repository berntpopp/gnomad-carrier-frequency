name: Update ClinGen Data

on:
  schedule:
    # Run weekly on Mondays at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download & Validate ClinGen Gene Validity Data
        run: bun run scripts/update-clingen-gene-validity.ts

      - name: Run ClinGen validation test suite
        run: bun test scripts/__tests__/update-clingen.test.ts

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet apps/web/public/data/clingen-gene-validity.csv && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/web/public/data/clingen-gene-validity.csv
          git commit -m "chore: update ClinGen gene validity data [skip ci]"
          git push
